
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08070c">
<meta name="description" content="Spesial Edition - Video pilihan">

<title>SPESIAL EDITION</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at top left, #35101e, transparent 45%),
    radial-gradient(ellipse at bottom right, #17112c, transparent 45%),
    #08070c;
  color: white;
  min-height: 100vh;
}

/* HEADER */

.header {
  padding: 28px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  display: flex;
  align-items: center;
  gap: 13px;
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo-icon {
  background: #ff3158;
  width: 55px;
  height: 55px;
  border-radius: 17px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 25px #ff315855;
}

.logo-icon span {
  font-size: 25px;
}

.logo b {
  color: #ff3158;
}

.live-header {
  border: 1px solid #92243f;
  color: #ff6684;
  background: #2c101b;
  padding: 12px 20px;
  border-radius: 30px;
  font-weight: bold;
  letter-spacing: 2px;
}

/* INFO BAR */

.info-bar {
  margin: 10px 18px 35px;
  padding: 20px 12px;
  background: #17161c;
  border: 1px solid #302c38;
  border-radius: 24px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  gap: 8px;
  color: #dddce5;
  font-weight: bold;
  letter-spacing: 1px;
  font-size: 14px;
}

.dot {
  color: #ff6684;
  font-size: 20px;
}

/* VIDEO GRID */

.container {
  padding: 0 17px 35px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px 16px;
}

.video-card {
  position: relative;
  overflow: hidden;
  border-radius: 34px;
  border: 2px solid #34303c;
  aspect-ratio: 0.73;
  background: #17141c;
  cursor: pointer;
  text-align: left;
  color: white;
  padding: 0;
  width: 100%;
}

.video-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
  transition: transform .3s;
}

.video-card:active img {
  transform: scale(1.04);
}

.video-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    transparent 45%,
    rgba(0,0,0,.85) 100%
  );
}

.live-label {
  position: absolute;
  top: 17px;
  left: 13px;
  z-index: 2;
  background: #ff3158;
  padding: 9px 13px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 13px;
  letter-spacing: 1px;
}

.hd-label {
  position: absolute;
  top: 17px;
  right: 13px;
  z-index: 2;
  background: #282828dd;
  padding: 9px 13px;
  border-radius: 12px;
  font-weight: bold;
}

.play-circle {
  position: absolute;
  z-index: 2;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: #ff3158ed;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 25px #ff315855;
}

.play-circle span {
  font-size: 34px;
  margin-left: 6px;
}

.video-info {
  position: absolute;
  bottom: 20px;
  left: 17px;
  z-index: 2;
}

.video-info h3 {
  font-size: 20px;
  margin-bottom: 8px;
  text-transform: none;
}

.video-info p {
  color: #dedee5;
  font-size: 14px;
}

/* SECTION */

.section-title {
  font-size: 21px;
  margin: 0 0 20px 3px;
}

/* VIDEO PLAYER MODAL */

.modal {
  display: none;
  position: fixed;
  z-index: 99;
  inset: 0;
  background: #000e;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal.active {
  display: flex;
}

.player-box {
  width: 100%;
  max-width: 550px;
  position: relative;
  background: #111;
  border-radius: 18px;
  overflow: hidden;
}

.player-box video {
  width: 100%;
  max-height: 80vh;
  display: block;
  background: black;
}

.close-btn {
  position: absolute;
  z-index: 5;
  right: 10px;
  top: 10px;
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  color: white;
  background: #ff3158;
  font-size: 23px;
  cursor: pointer;
}

/* FOOTER */

.footer {
  text-align: center;
  padding: 30px 15px;
  color: #999;
  font-size: 13px;
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">
  <div class="logo">
    <div class="logo-icon">
      <span>▶</span>
    </div>
    <div>SPESIAL<b>EDITION</b></div>
  </div>

  <div class="live-header">● LIVE</div>
</header>

<!-- INFO -->

<div class="info-bar">
  <span class="dot">●</span>
  <span>KUALITAS HD</span>
  <span class="dot">●</span>
  <span>TANPA DAFTAR</span>
  <span class="dot">●</span>
</div>

<!-- VIDEO LIST -->

<main class="container">

<h2 class="section-title">▣ PILIH VIDEO</h2>

<div class="video-grid">

  <button class="video-card"
    data-video="videos/video1.mp4">
    <img src="images/thumb1.jpg" alt="Video 1">
    <span class="live-label">● LIVE</span>
    <span class="hd-label">HD</span>
    <div class="play-circle"><span>▶</span></div>
    <div class="video-info">
      <h3>Video 1</h3>
      <p>Ketuk untuk menonton</p>
    </div>
  </button>

  <button class="video-card"
    data-video="videos/video2.mp4">
    <img src="images/thumb2.jpg" alt="Video 2">
    <span class="live-label">● LIVE</span>
    <span class="hd-label">HD</span>
    <div class="play-circle"><span>▶</span></div>
    <div class="video-info">
      <h3>Video 2</h3>
      <p>Ketuk untuk menonton</p>
    </div>
  </button>

  <button class="video-card"
    data-video="videos/video3.mp4">
    <img src="images/thumb3.jpg" alt="Video 3">
    <span class="live-label">● LIVE</span>
    <span class="hd-label">HD</span>
    <div class="play-circle"><span>▶</span></div>
    <div class="video-info">
      <h3>Video 3</h3>
      <p>Ketuk untuk menonton</p>
    </div>
  </button>

  <button class="video-card"
    data-video="videos/video4.mp4">
    <img src="images/thumb4.jpg" alt="Video 4">
    <span class="live-label">● LIVE</span>
    <span class="hd-label">HD</span>
    <div class="play-circle"><span>▶</span></div>
    <div class="video-info">
      <h3>Video 4</h3>
      <p>Ketuk untuk menonton</p>
    </div>
  </button>

  <button class="video-card"
    data-video="videos/video5.mp4">
    <img src="images/thumb5.jpg" alt="Video 5">
    <span class="live-label">● LIVE</span>
    <span class="hd-label">HD</span>
    <div class="play-circle"><span>▶</span></div>
    <div class="video-info">
      <h3>Video 5</h3>
      <p>Ketuk untuk menonton</p>
    </div>
  </button>

  <button class="video-card"
    data-video="videos/video6.mp4">
    <img src="images/thumb6.jpg" alt="Video 6">
    <span class="live-label">● LIVE</span>
    <span class="hd-label">HD</span>
    <div class="play-circle"><span>▶</span></div>
    <div class="video-info">
      <h3>Video 6</h3>
      <p>Ketuk untuk menonton</p>
    </div>
  </button>

</div>
</main>

<!-- PLAYER -->

<div class="modal" id="videoModal">
  <div class="player-box">
    <button class="close-btn" id="closePlayer">×</button>
    <video id="mainVideo"
      controls
      playsinline
      preload="metadata">
    </video>
  </div>
</div>

<footer class="footer">
  © 2026 SPESIAL EDITION
</footer>

<script>
const modal = document.getElementById("videoModal");
const player = document.getElementById("mainVideo");
const closeBtn = document.getElementById("closePlayer");

document.querySelectorAll(".video-card").forEach(card => {

  card.addEventListener("click", function() {

    const videoUrl = this.dataset.video;

    if (!videoUrl) {
      alert("Link video belum dipasang.");
      return;
    }

    player.pause();
    player.src = videoUrl;
    modal.classList.add("active");

    player.load();

    const playPromise = player.play();

    if (playPromise !== undefined) {
      playPromise.catch(() => {
        // Pengguna dapat menekan tombol Play manual.
      });
    }

  });

});

function closeModal() {
  player.pause();
  player.removeAttribute("src");
  player.load();
  modal.classList.remove("active");
}

closeBtn.addEventListener("click", closeModal);

modal.addEventListener("click", function(e) {
  if (e.target === modal) {
    closeModal();
  }
});

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    closeModal();
  }
});
</script>

</body>
</html>
