
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Video News</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #111827;
}

/* HEADER */
.header {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 25px;
  border-bottom: 1px solid #eeeeee;
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 27px;
  font-weight: bold;
}

.logo-icon {
  width: 60px;
  height: 60px;
  background: #111827;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 14px;
  font-size: 32px;
}

.logo span {
  color: #3984e9;
}

.upload {
  background: #111827;
  color: white;
  border: none;
  border-radius: 25px;
  padding: 18px 30px;
  font-size: 20px;
  font-weight: bold;
}

/* CONTENT */
.container {
  padding: 25px 20px;
}

.advertise {
  font-size: 29px;
  color: #64748b;
  margin-bottom: 65px;
}

/* VIDEO CARD */
.video-card {
  width: 100%;
  max-width: 850px;
  margin: auto;
  position: relative;
  overflow: hidden;
  border-radius: 45px;
  background: #111;
  aspect-ratio: 9 / 16;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

.video-card video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* PLAY BUTTON BESAR */
.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: rgba(255,255,255,0.95);
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  z-index: 5;
  box-shadow: 0 5px 25px rgba(0,0,0,0.25);
  transition: 0.2s;
}

.play-button:hover {
  transform: translate(-50%, -50%) scale(1.10);
}

.play-button::before {
  content: "";
  width: 0;
  height: 0;
  border-top: 30px solid transparent;
  border-bottom: 30px solid transparent;
  border-left: 45px solid #000;
  margin-left: 10px;
}

.play-button.hidden {
  display: none;
}

/* MOBILE */
@media(max-width:600px) {
  .header {
    padding: 12px 15px;
  }

  .logo {
    font-size: 23px;
  }

  .logo-icon {
    width: 55px;
    height: 55px;
  }

  .upload {
    padding: 15px 22px;
    font-size: 17px;
  }

  .container {
    padding: 25px 15px;
  }

  .advertise {
    font-size: 27px;
    margin-bottom: 60px;
  }

  .video-card {
    border-radius: 35px;
  }

  .play-button {
    width: 150px;
    height: 150px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">V</div>
    <div>vldey<span>.co</span></div>
  </div>

  <button class="upload">Upload</button>
</header>

<main class="container">

  <div class="advertise">Advertise</div>

  <div class="video-card">

    <video
      id="myVideo"
      poster="https://placehold.co/600x1067/252525/ffffff?text=VIDEO+THUMBNAIL"
      playsinline
      preload="metadata"
    >
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    </video>

    <button
      class="play-button"
      id="playButton"
      aria-label="Putar video">
    </button>

  </div>

</main>

<script>
const video = document.getElementById("myVideo");
const playButton = document.getElementById("playButton");

playButton.addEventListener("click", function() {
  video.play().then(() => {
    playButton.classList.add("hidden");
    video.controls = true;
  }).catch(() => {
    alert("Video gagal diputar. Periksa link video.");
  });
});

video.addEventListener("ended", function() {
  playButton.classList.remove("hidden");
  video.controls = false;
});

video.addEventListener("pause", function() {
  if (!video.ended) {
    playButton.classList.remove("hidden");
  }
});

video.addEventListener("play", function() {
  playButton.classList.add("hidden");
});
</script>

</body>
</html>
