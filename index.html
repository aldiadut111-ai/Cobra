<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Vldey Video</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
  color: #111827;
  font-family: Arial, sans-serif;
}

header {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 25px;
  border-bottom: 1px solid #e5e7eb;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 28px;
  font-weight: bold;
}

.logo-icon {
  width: 58px;
  height: 58px;
  background: #111827;
  color: white;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

.logo span {
  color: #4388e8;
}

.upload {
  background: #111827;
  color: white;
  padding: 17px 28px;
  border-radius: 25px;
  font-size: 18px;
  font-weight: bold;
}

.container {
  padding: 25px;
}

.advertise {
  color: #64748b;
  font-size: 25px;
  margin-bottom: 35px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
}

.video-card {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 9 / 16;
  border-radius: 35px;
  overflow: hidden;
  background: #222;
  box-shadow: 0 8px 25px rgba(0,0,0,.12);
  cursor: pointer;
  text-decoration: none;
}

.video-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 105px;
  height: 105px;
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 15px rgba(0,0,0,.2);
}

.play-button::after {
  content: "";
  margin-left: 9px;
  border-top: 23px solid transparent;
  border-bottom: 23px solid transparent;
  border-left: 35px solid #111;
}

.video-card:active .play-button {
  transform: translate(-50%, -50%) scale(.9);
}

@media(max-width:600px) {
  .video-grid {
    grid-template-columns: 1fr;
  }

  .container {
    padding: 20px 15px;
  }
}
</style>
</head>

<body>

<header>
