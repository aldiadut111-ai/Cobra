
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">

<title>Video News</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff;
  color: #111827;
}

/* HEADER */
.header {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 25px;
  border-bottom: 1px solid #eee;
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 27px;
  font-weight: bold;
}

.logo-icon {
  width: 60px;
  height: 60px;
  background: #111827;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 14px;
  font-size: 32px;
}

.logo span {
  color: #3984e9;
}

.upload {
  background: #111827;
  color: white;
  border: none;
  border-radius: 25px;
  padding: 18px 30px;
  font-size: 20px;
  font-weight: bold;
}

/* CONTENT */
.container {
  padding: 25px 20px;
}

.advertise {
  font-size: 29px;
  color: #64748b;
  margin-bottom: 65px;
}

/* VIDEO CARD */
.video-card {
  width: 100%;
  max-width: 850px;
  margin: auto;
  position: relative;
  overflow: hidden;
  border-radius: 40px;
  background: #111;
  aspect-ratio: 9 / 16;
  box-shadow: 0 8px 30px rgba(0,0,0,.15);
}

.video-card video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* AREA KLIK SELURUH VIDEO */
.video-click-area {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  background: transparent;
  border: none;
  width: 100%;
  height: 100%;
}

.video-click-area.hidden {
  display: none;
}

/* PLAY BUTTON BESAR */
.play-button {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: rgba(255,255,255,.96);
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 5px 25px rgba(0,0,0,.25);
  transition: transform .2s;
  pointer-events: none;
}

.video-click-area:active .play-button {
  transform: scale(.92);
}

.play-button::before {
  content: "";
  width: 0;
  height: 0;
  border-top: 34px solid transparent;
  border-bottom: 34px solid transparent;
  border-left: 50px solid #000;
  margin-left: 12px;
}

/* MOBILE */
@media(max-width:600px) {
  .header {
    height: 90px;
    padding: 12px 15px;
  }

  .logo {
    font-size: 23px;
  }

  .logo-icon {
    width: 55px;
    height: 55px;
  }

  .upload {
    padding: 15px 22px;
    font-size: 17px;
  }

  .container {
    padding: 25px 15px;
  }

  .advertise {
    font-size: 27px;
    margin-bottom: 60px;
  }

  .video-card {
    border-radius: 35px;
  }

  .play-button {
    width: 150px;
    height: 150px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="logo">
    <div class="logo-icon">V</div>
    <div>vldey<span>.co</span></div>
  </div>

  <button class="upload" type="button">
    Upload
  </button>

</header>

<!-- CONTENT -->
<main class="container">

  <div class="advertise">Advertise</div>

  <!-- VIDEO CARD -->
  <div class="video-card">

    <video
      id="myVideo"
      poster="https://placehold.co/600x1067/252525/ffffff?text=VIDEO+THUMBNAIL"
      playsinline
      preload="metadata"
      controls
    >
      <source
        src="https://videotourl.com/videos/1794844886007-d581965f-ce17-4406-afe3-153ac8cc3fd2.mp4"
        type="video/mp4">
    </video>

    <!-- SELURUH AREA BISA DIKLIK -->
    <button
      class="video-click-area"
      id="clickArea"
      type="button"
      aria-label="Buka iklan dan putar video">

      <span class="play-button"></span>

    </button>

  </div>

</main>

<script>

/* =================================
   LINK DIRECT MONETAG
================================= */

const MONETAG_LINK = "MASUKKAN_LINK_DIRECT_MONETAG_KAMU";

/* =================================
   VIDEO DAN TOMBOL PLAY
================================= */

const video = document.getElementById("myVideo");
const clickArea = document.getElementById("clickArea");

let sudahKlik = false;

clickArea.addEventListener("click", function() {

  // CEK LINK MONETAG
  if (
    !MONETAG_LINK ||
    MONETAG_LINK === "https://uplcm.com/4/11810812"
  ) {
    alert("Masukkan link Direct Monetag terlebih dahulu!");
    return;
  }

  // BUKA IKLAN MONETAG SAAT DIKLIK
  if (!sudahKlik) {

    window.open(
      MONETAG_LINK,
      "_blank",
      "noopener,noreferrer"
    );

    sudahKlik = true;
  }

  // PUTAR VIDEO DI HALAMAN UTAMA
  video.play().then(function() {

    clickArea.classList.add("hidden");

  }).catch(function() {

    // Jika video gagal diputar,
    // tombol tetap tersedia
    sudahKlik = false;

    alert("Video gagal diputar. Periksa link MP4.");

  });

});

/* HILANGKAN TOMBOL SAAT VIDEO DIPUTAR */
video.addEventListener("play", function() {
  clickArea.classList.add("hidden");
});

/* TAMPILKAN KEMBALI SETELAH VIDEO SELESAI */
video.addEventListener("ended", function() {
  clickArea.classList.remove("hidden");
  sudahKlik = false;
});

</script>

</body>
</html>
